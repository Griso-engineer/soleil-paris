<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Tests — Soleil & protections</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; color: #111; background: #fff; }
    .ok { color: #1b7f3a; } .ko { color: #c0262d; font-weight: 700; }
    td { padding: 2px 10px 2px 0; vertical-align: top; }
  </style>
</head>
<body>
  <h1 id="title">Tests en cours…</h1>
  <table id="out"></table>
  <script type="module">
    // Tests de non-régression : on appelle les fonctions JavaScript du site telles quelles et on
    // compare leurs résultats à des valeurs de référence indépendantes (éphémérides, géométrie).
    import { sunPosition, parisLocalToUTC, sunTimes } from '../js/solar.js';
    import { streetDay, defaultStreet } from '../js/street.js';
    import { fmtHour } from '../js/charts.js';

    const rows = [];
    const check = (name, ok, detail) => rows.push({ name, ok: !!ok, detail });
    const near = (name, v, ref, tol, unit = '') =>
      check(name, Math.abs(v - ref) <= tol, `${v.toFixed(3)}${unit} (attendu ${ref}${unit} ± ${tol})`);
    const doyOf = (y, m, d) => Math.round((Date.UTC(y, m - 1, d) - Date.UTC(y, 0, 0)) / 86400e3);
    const toMin = (h) => h * 60;

    // --- Position du soleil : hauteur à midi solaire = 90° − φ + δ ---
    {
      const t = sunTimes(2026, doyOf(2026, 6, 21));
      near('Hauteur max au solstice d\'été (Paris)', t.maxAlt, 64.6, 0.3, '°');
      const w = sunTimes(2026, doyOf(2026, 12, 21));
      near('Hauteur max au solstice d\'hiver', w.maxAlt, 17.7, 0.4, '°');
    }
    // --- Lever et coucher : éphémérides pour Paris, 21 juin 2026 (5 h 47, 21 h 58) ---
    {
      const t = sunTimes(2026, doyOf(2026, 6, 21));
      near('Lever du soleil le 21 juin (min)', toMin(t.rise), 5 * 60 + 47, 2, ' min');
      near('Coucher du soleil le 21 juin (min)', toMin(t.set), 21 * 60 + 58, 2, ' min');
      const e = sunTimes(2026, doyOf(2026, 12, 21));
      near('Lever du soleil le 21 décembre (min)', toMin(e.rise), 8 * 60 + 41, 2, ' min');
      near('Coucher du soleil le 21 décembre (min)', toMin(e.set), 16 * 60 + 56, 2, ' min');
    }
    // --- Masque urbain : le cumul de la journée doit compter le diffus et le réfléchi ---
    {
      const base = defaultStreet();
      for (const [label, az] of [['nord', 0], ['est', 90], ['sud', 180], ['ouest', 270]]) {
        for (const [when, doy] of [['21 juin', doyOf(2026, 6, 21)], ['équinoxe', doyOf(2026, 3, 20)]]) {
          const d = streetDay({ ...base, facadeAz: az }, 2026, doy);
          check(`Façade ${label}, ${when} : énergie sur la journée ≥ énergie face au soleil`,
            d.day0 >= d.e0 - 1e-6 && d.day1 >= d.e1 - 1e-6, `journée ${d.day1.toFixed(0)} / face au soleil ${d.e1.toFixed(0)} Wh/m²`);
          check(`Façade ${label}, ${when} : la façade reçoit de l'énergie (diffus du ciel)`, d.day1 > 50, `${d.day1.toFixed(0)} Wh/m² avec le vis-à-vis`);
          check(`Façade ${label}, ${when} : le vis-à-vis ne crée pas d'énergie`, d.day1 <= d.day0 + 1e-6, `${d.day1.toFixed(0)} ≤ ${d.day0.toFixed(0)} Wh/m²`);
        }
      }
      const n = streetDay({ ...base, facadeAz: 0 }, 2026, doyOf(2026, 3, 20));
      check('Façade nord à l\'équinoxe : pas de soleil direct, mais du diffus', n.h0 < 0.2 && n.day1 > 50, `${n.h0.toFixed(2)} h de soleil, ${n.day1.toFixed(0)} Wh/m²`);
    }
    // --- Affichage de l'heure : le curseur donne des valeurs comme 11,99999 ---
    check('fmtHour(11,999995) affiche 12h00', fmtHour(144 * 0.0833333) === '12h00', fmtHour(144 * 0.0833333));
    check('fmtHour(18,5) affiche 18h30', fmtHour(18.5) === '18h30', fmtHour(18.5));
    // --- Cohérence heure légale / UTC (changement d'heure) ---
    {
      const s = new Date(parisLocalToUTC(2026, doyOf(2026, 7, 1), 12)).getUTCHours();
      const w = new Date(parisLocalToUTC(2026, doyOf(2026, 1, 15), 12)).getUTCHours();
      check('Midi légal en été = 10 h UTC, en hiver = 11 h UTC', s === 10 && w === 11, `été ${s} h, hiver ${w} h UTC`);
      const p = sunPosition(parisLocalToUTC(2026, doyOf(2026, 6, 21), 13.9));
      near('Azimut vers 13 h 54 le 21 juin (proche du sud)', p.azimuth, 180, 3, '°');
    }

    const ko = rows.filter((r) => !r.ok).length;
    document.getElementById('out').innerHTML = rows.map((r) => `<tr><td class="${r.ok ? 'ok' : 'ko'}">${r.ok ? 'OK' : 'ÉCHEC'}</td><td>${r.name}</td><td>${r.detail}</td></tr>`).join('');
    document.getElementById('title').textContent = ko ? `${ko} échec(s) sur ${rows.length} tests` : `${rows.length} tests réussis`;
    document.title = ko ? `ECHEC ${ko}/${rows.length}` : `OK ${rows.length}/${rows.length}`;
  </script>
</body>
</html>
